[package]
name = "kjarni-transformers"
description = "Low-level transformer operations for Kjarni"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true


[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }

rand = { workspace = true }
half = { workspace = true }
once_cell = { workspace = true }

async-trait = { workspace = true }
rayon = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
rand_distr = { workspace = true }
log = { workspace = true }
ndarray-rand = { workspace = true }
libm = { workspace = true }
matrixmultiply = { workspace = true }
faer = { workspace = true }


byteorder = "1.5.0"
async-stream = "0.3.6"
#futures-core = "0.3.31"
#futures-util = "0.3.31"
strum = "0.26"
rand_chacha = "0.9.0"
strum_macros = "0.26"

hound = "3.5"           # WAV loading (simple, no dependencies)
ndarray = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.32"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true, features = [
    "fragile-send-sync-non-atomic-wasm",
] }
futures-intrusive = { workspace = true, optional = true }
# std::time::Instant panics on this target; see utils::time.
web-time = "1.1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
# ReceiverStream only needs tokio::sync::mpsc, which is in the wasm-safe feature
# set, and `generate` is built on top of the streaming path.
tokio-stream = { version = "0.1.18", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
gguf-rs = "0.1.5"
gguf = "0.1.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
reqwest = { workspace = true }
memmap2 = { workspace = true }
pollster = { workspace = true }
dirs = { workspace = true }
wgpu = { workspace = true }
futures-intrusive = { workspace = true }
num_cpus = "1.16"
libc = "0.2.177"
rubato = "0.14"         # High-quality resampling

[dev-dependencies]
env_logger = "0.10"
approx = "0.5.1"
tempfile = "3.23.0"

[features]
# Compile the wgpu compute stack for the browser. Off by default: it pulls
# wgpu into the wasm graph, and the CPU bundle should not pay for it.
wasm-gpu = ["dep:wgpu", "dep:futures-intrusive"]
default = []
profiling = []
rubato = []
symphonia = []
tokio = []   # Defines the feature flag "tokio" (maybe it doesnt make sense to not hae it)
nvidia = []  # Defines the feature flag "nvidia"

[lints]
workspace = true
