[package]
name = "kjarni-models"
description = "Model implementations for Kjarni"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kjarni-transformers = { workspace = true }
# Optional: only pulled in by the `image-io` feature below.
zune-jpeg = { workspace = true, optional = true }
png = { workspace = true, optional = true }
kjarni-rag = { workspace = true }

# Inherit from workspace
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
half = { workspace = true }
pollster = { workspace = true }
once_cell = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
ndarray-rand = { workspace = true }
#futures-util = { workspace = true }
#futures-core = { workspace = true }
async-stream = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
faer = { workspace = true }
lru = "0.12.3"
futures = "0.3.31"
tempfile = "3.23.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# The workspace tokio asks for rt-multi-thread and fs, neither of which exists on
# wasm, so the crate failed to build for wasm32 before reaching any of its own code.
# This mirrors the split kjarni-transformers already uses.
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
env_logger = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Unique deps

[lints]
workspace = true

[features]
default = []

# Decode JPEG and PNG from bytes. Without it the CLIP vision tower still works,
# it just takes raw RGB from the caller, which is what an FFI or WASM host
# usually already has. With it, `kjarni index` can walk a photo directory.
image-io = ["dep:zune-jpeg", "dep:png"]

# `harness = false`: this emits JSON for diffing against bench/torch_side.py, so
# the test harness's own output would only get in the way.
[[bench]]
name = "torch_comparison"
harness = false
