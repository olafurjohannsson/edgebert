[package]
name = "kjarni-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Kjarni inference engine: embeddings, classification, reranking, generation and search"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kjarni"
path = "src/main.rs"

[dependencies]
kjarni = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
env_logger = "0.11"
colored = "2"
bincode = "1"
walkdir = "2.5.0"
tempfile = "3.23.0"
[lints]
workspace = true

[features]
default = ["image-io"]

# On by default here, unlike the library: someone running the CLI wants
# `kjarni image index ~/Photos` to work without rebuilding with a flag.
image-io = ["kjarni/image-io"]
