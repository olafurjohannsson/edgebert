language = "C"
header = """
/*
 * Kjarni FFI - C bindings for Kjarni ML library
 * Auto-generated by cbindgen. Do not edit manually.
 */
"""
include_guard = "KJARNI_FFI_H"
# Emit `extern "C"` guards. Without these a C++ translation unit name-mangles every
# declaration and linking fails, which made the header C-only in practice.
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

[defines]
"feature = c-bindings" = "KJARNI_FFI"
# Image search is feature-gated in Rust, so its declarations are guarded here too.
# Without this entry cbindgen emits them unconditionally, and a C caller linking a
# build without the feature gets declarations for symbols that do not exist.
"feature = image-io" = "KJARNI_IMAGE_IO"

[export]
# No prefix: every exported type is already named `Kjarni*` in Rust, so adding one
# produced `KjarniKjarniEmbedder` and `KjarniKjarniErrorCode` in the generated
# header. Fixing it is a breaking change for C consumers, done now while there are
# none rather than later.

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
# No prefix. In cbindgen `[fn] prefix` emits a token *before the return type* — it is
# meant for export macros like `EXPORT_API`, not for naming. Set to "kjarni_" it
# produced `kjarni_ enum KjarniErrorCode kjarni_embedder_new(...)`, which is not
# valid C, so the published header never compiled. The functions are already named
# `kjarni_*` in Rust.