[package]
name = "kjarni-wasm"
version.workspace = true
edition = "2024"
authors = ["Ólafur Aron Jóhannsson <olafurjohannss@gmail.com>"]
description = "Local AI inference in the browser: embeddings, classification, reranking, semantic search and chat, compiled to WebAssembly."
repository = "https://github.com/olafurjohannsson/kjarni"
license = "MIT"
keywords = ["bert", "nlp", "wasm", "transformer", "embeddings"]
categories = ["wasm", "text-processing", "encoding"]

# The built bundle, the npm package and the Obsidian plugin fixtures are not part
# of the Rust source distribution.
exclude = ["pkg/", "ts/", "plugins/", "tests/browser/node_modules/", "scripts/__pycache__/"]

[features]
default = []  # No OpenBLAS by default

# Run the encoder on the browser's WebGPU adapter instead of the CPU. Off by
# default: it pulls wgpu into the bundle, and the CPU build should not pay for
# it. Requires a browser with WebGPU.
wasm-gpu = ["kjarni-models/wasm-gpu", "kjarni-transformers/wasm-gpu"]
openblas = ["dep:blas-src", "dep:openblas-src", "ndarray/blas"]

[dependencies]
kjarni-rag = { workspace = true }
kjarni-search = { path = "../kjarni-search" }
# The engine. This crate used to carry its own tokenizer, feedforward, SIMD and
# weight-loading code; those are being replaced by the real implementations so a
# browser build and a native build run the same inference path.
kjarni-transformers = { path = "../kjarni-transformers" }
kjarni-models = { path = "../kjarni-models" }
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3.31"
# The generation loop communicates over a tokio mpsc channel.
tokio = { version = "1", features = ["sync"] }
safetensors = "0.6.2"
wasm-bindgen = "0.2.100"
reqwest = { version = "0.12.23", features = ["blocking", "rustls-tls"], default-features = false }
lru = "0.16.1"
once_cell = "1.21.3"

# Optional BLAS dependencies
blas-src = { version = "0.10", features = ["openblas"], optional = true }
openblas-src = { version = "0.10", features = ["cblas", "system"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
rayon = "1.11.0"
dirs = "6.0.0"
ndarray-stats = "0.6.0"
matrixmultiply = { version = "0.3", features = ["threading", "num_cpus", "cgemm"] }
ndarray = { version = "0.16", features = ["rayon", "matrixmultiply-threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
ndarray = "0.16.1"
console_error_panic_hook = "0.1.7"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
pkg-config = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.7.0"

[package.metadata.wasm-pack.profile.release]
# Size matters here: the engine is a far larger codebase than the hand-rolled stack
# it replaced, and this bundle is downloaded by every visitor.
wasm-opt = ["-Os", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
