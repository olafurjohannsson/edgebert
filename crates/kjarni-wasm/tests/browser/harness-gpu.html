<!doctype html>
<meta charset="utf-8">
<title>kjarni wasm-gpu harness</title>
<script type="module">
import init, {
  WasmModel, WasmGpuEncoder, WasmGpuReranker, WasmGpuClassifier,
} from "/pkg/kjarni_wasm.js";

const cosine = (a, b) => {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
};
// serde-wasm-bindgen returns Rust structs as JS Maps, not plain objects.
const plain = v => (v instanceof Map ? Object.fromEntries(v) : v);

const bytes = async name =>
  new Uint8Array(await (await fetch(`/models/${name}`)).arrayBuffer());

window.__run = async () => {
  await init();

  const exported = { WasmGpuEncoder, WasmGpuReranker, WasmGpuClassifier };
  const missing = Object.entries(exported)
    .filter(([, v]) => typeof v !== "function")
    .map(([k]) => k);

  // No adapter is a skip, not a failure: the runner may have no GPU at all.
  if (!navigator.gpu) return { skipped: "navigator.gpu is undefined", missing };
  const adapter = await navigator.gpu.requestAdapter().catch(() => null);
  if (!adapter) return { skipped: "requestAdapter returned null", missing };

  const encoderBytes = await bytes("all-MiniLM-L6-v2-q8.kjq");

  let gpu;
  try {
    gpu = await WasmGpuEncoder.fromQuantized(encoderBytes);
  } catch (e) {
    // Not necessarily a failure. An adapter at WebGPU's guaranteed floor cannot
    // run shaders that declare 1024 invocations, and the engine refuses rather
    // than returning NaN. The runner decides, so report the limits that explain it.
    const lim = adapter.limits;
    return {
      missing,
      gpuLoadError: String(e),
      limits: {
        maxComputeInvocationsPerWorkgroup: lim.maxComputeInvocationsPerWorkgroup,
        maxComputeWorkgroupSizeX: lim.maxComputeWorkgroupSizeX,
        maxStorageBufferBindingSize: lim.maxStorageBufferBindingSize,
      },
    };
  }

  const limits = plain(gpu.adapterLimits());
  const dim = gpu.dimension();

  // The load-bearing assertion. Both devices run the same weights through the
  // same engine, so anything below 1.0 means a shader disagrees with the CPU.
  const TEXT = "Reykjavik is the capital of Iceland and its largest city.";
  const cpu = WasmModel.from_quantized(encoderBytes);
  const cpuVec = Array.from(cpu.encode([TEXT], true));
  const gpuVec = Array.from(await gpu.embed(TEXT));
  const parity = cosine(cpuVec, gpuVec);

  // A batch exercises a different code path than a single text.
  const BATCH = [TEXT, "Oslo is the capital of Norway.", "Python is a language."];
  const batch = await gpu.embedBatch(BATCH);
  const batchParity = cosine(Array.from(batch[0]), gpuVec);

  // Reranking on the GPU: the ordering matters more than the absolute logits.
  const rr = await WasmGpuReranker.fromQuantized(
    await bytes("ms-marco-MiniLM-L-6-v2-q8.kjq"),
  );
  const ranked = (await rr.rerank(
    "What is the capital of Iceland?",
    [
      "Python is a high-level programming language.",
      "Reykjavik is the capital and largest city of Iceland.",
      "Oslo is the capital of Norway.",
    ],
    3,
  )).map(plain);

  return {
    missing,
    limits,
    dim,
    parity,
    batchParity,
    batchLen: batch.length,
    topIndex: ranked[0].index,
    topScore: ranked[0].score,
    ordered: ranked.every((r, i) => i === 0 || ranked[i - 1].score >= r.score),
  };
};
</script>
