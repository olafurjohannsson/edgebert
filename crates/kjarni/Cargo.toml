[package]
name = "kjarni"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Kjarni: The SQLite of AI. A fast, small-footprint inference toolkit for edge, browser, and native platforms."

[lib]
name = "kjarni"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kjarni-transformers = { workspace = true }
kjarni-models = { workspace = true }
kjarni-search = { workspace = true }
kjarni-rag = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
directories = "6.0.0"
config = "0.15.19"
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
thiserror = "2.0.17"
#futures-util = "0.3.31"
toml = "0.8.10"
walkdir = "2.5.0"
glob-match = "0.2"
tempfile = "3.23.0"
log.workspace = true
[features]
default = []
python = ["pyo3"]
c-bindings = []

# Image decoding for the CLIP path. Off by default: an FFI or WASM host usually
# holds decoded pixels already, and making every consumer compile a JPEG decoder
# to reach the vision tower would be a poor trade.
image-io = ["kjarni-models/image-io"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tokio-stream = "0.1.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# See the note in kjarni-models: the workspace tokio is not wasm-buildable.
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-stream = "0.1.18"
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
